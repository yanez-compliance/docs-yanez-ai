site_name: Yanez Docs
site_description: Integration documentation for YID partner integration and Yanez Pulse agent authorization.
site_url: https://docs.yanez.ai/
repo_url: https://github.com/yanez-compliance/docs-yanez-ai
edit_uri: edit/main/docs/

exclude_docs: |
  superpowers/

theme:
  name: material
  logo: assets/yanez-logo.svg
  favicon: assets/yanez-logo.svg
  icon:
    repo: fontawesome/brands/github
  features:
    - navigation.tabs
    - navigation.sections
    - navigation.indexes
    - navigation.top
    - navigation.footer
    - toc.follow
    - content.action.edit
    - content.code.copy
    - content.tabs.link
    - search.suggest
    - search.highlight
  palette:
    - scheme: slate
      primary: black
      accent: deep-purple
      toggle:
        icon: material/brightness-4
        name: Switch to light mode
    - scheme: default
      primary: white
      accent: deep-purple
      toggle:
        icon: material/brightness-7
        name: Switch to dark mode

extra_css:
  - stylesheets/extra.css

extra_javascript:
  - javascripts/portal.js

plugins:
  - search
  - blog:
      blog_dir: changelog
      blog_toc: true
      post_url_format: "{slug}"
      post_excerpt: required
      archive: false
      categories_allowed:
        - Backend API
        - iOS
        - Android
        - Web
        - Pulse
        - Breaking
        - Docs
  - redirects:
      redirect_maps:
        quickstart.md: yid/quickstart.md
        overview.md: yid/overview.md
        onboarding.md: yid/onboarding.md
        authentication.md: yid/authentication.md
        deep-link-signing.md: yid/deep-link-signing.md
        callback.md: yid/callback.md
        api/backend-api.md: yid/api/backend-api.md
        api/errors.md: yid/api/errors.md
        platforms/web.md: yid/platforms/web.md
        platforms/android.md: yid/platforms/android.md
        platforms/ios.md: yid/platforms/ios.md
        testing.md: yid/testing.md
        privacy-security.md: yid/privacy-security.md
        production-checklist.md: yid/production-checklist.md
        glossary.md: concepts/glossary.md

markdown_extensions:
  - admonition
  - attr_list
  - md_in_html
  - tables
  - toc:
      permalink: true
  - pymdownx.details
  - pymdownx.superfences:
      custom_fences:
        # ponytail: not Material's mermaid class. Material renders into a closed
        # shadow root, which pulse.js can't clone for click-to-zoom.
        - name: mermaid
          class: pulse-mermaid
          format: !!python/name:pymdownx.superfences.fence_div_format
  - pymdownx.tabbed:
      alternate_style: true
  - pymdownx.emoji:
      emoji_index: !!python/name:material.extensions.emoji.twemoji
      emoji_generator: !!python/name:material.extensions.emoji.to_svg

nav:
  - Home: index.md
  - Concepts:
      - Glossary: concepts/glossary.md
  - YID Partner Integration:
      - yid/index.md
      - Start Here:
          - Quickstart: yid/quickstart.md
          - Overview: yid/overview.md
          - Onboarding: yid/onboarding.md
          - Partner Concepts: yid/concepts.md
      - Integration:
          - Authentication: yid/authentication.md
          - Deep Link Signing: yid/deep-link-signing.md
          - Callback Verification: yid/callback.md
      - Backend API:
          - API Reference: yid/api/backend-api.md
          - Errors: yid/api/errors.md
      - Platform Guides:
          - Web Apps: yid/platforms/web.md
          - Android Apps: yid/platforms/android.md
          - iPhone Apps: yid/platforms/ios.md
      - Going Live:
          - Testing: yid/testing.md
          - Privacy and Security: yid/privacy-security.md
          - Production Checklist: yid/production-checklist.md
  - Pulse:
      - pulse/index.md
      - Getting started:
          - Use with AI agents: pulse/ai-agents.md
          - Choosing an integration path: pulse/integration-options.md
          - HTTP quickstart: pulse/http-quickstart.md
          - FAQ: pulse/faq.md
          - Showcase: pulse/showcase.md
      - Concepts:
          - Terms: pulse/terms.md
          - Receipts: pulse/receipts.md
          - User-signed approvals: pulse/user-signed-approvals.md
          - Action enforcement: pulse/action-enforcement.md
      - Reference:
          - OpenAPI contract: https://github.com/yanez-compliance/yanez-agent-authorization/blob/main/openapi/agent-authorization.openapi.yaml
          - Python SDK: https://github.com/yanez-compliance/yanez-agent-authorization/tree/main/packages/python
          - TypeScript SDK: https://github.com/yanez-compliance/yanez-agent-authorization/tree/main/packages/typescript
          - CLI: https://github.com/yanez-compliance/yanez-agent-authorization/tree/main/cli
          - MCP server: https://github.com/yanez-compliance/yanez-agent-authorization/tree/main/integrations/mcp
          - Skill: https://github.com/yanez-compliance/yanez-agent-authorization/tree/main/skills/yanez-authorize
          - Examples: https://github.com/yanez-compliance/yanez-agent-authorization/tree/main/examples
  - Changelog:
      - changelog/index.md
  - Download: download.md
  - Support: support.md

extra:
  social:
    - icon: fontawesome/brands/github
      link: https://github.com/yanez-compliance
      name: Yanez on GitHub
    - icon: material/web
      link: https://www.yanez.ai
      name: yanez.ai
